<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Title</title>
</head>
<body>

<nav class="shadow-lg">
    <div class="flex flex-wrap justify-between ml-5 items-center mx-auto px-4 py-2.5">

        <a href="" class="flex items-center">
            <img class="h-9 mr-3"
                 src="https://cdn-icons-png.flaticon.com/128/2916/2916141.png">
            <span class="self-center text-xml font-semibold">
                Digital Marketplace
            </span>
        </a>

        <div class="flex items-center">
            <a href="{% url 'dashboard' %}" class="mr-6 text-sm font-medium text-gray-500">Dashboard</a>
            <a href="{% url 'sales' %}" class="mr-6 text-sm font-medium text-gray-500">Sales</a>
            <a href="" class="mr-6 text-sm font-medium text-gray-500">Orders</a>
            <a href="{% url 'create_product' %}" class="mr-6 text-sm font-medium text-gray-500">Create Products</a>
            <a href="{% url 'purchases' %}" class="mr-6 text-sm font-medium text-gray-500">My purchases</a>

            <form method="post" action="{% url 'logout' %}" class="mr-6">
                {% csrf_token %}
                <button type="submit"
                        class="text-sm font-medium text-gray-500 hover:text-red-500">
                    Logout
                </button>
            </form>

        </div>
    </div>
</nav>

{% block body %}
{% endblock %}

</body>
</html>
